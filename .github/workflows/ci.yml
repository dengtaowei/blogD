name: CI

on:
  pull_request:
    branches: [main]
  push:
    # 功能分支 push 即跑 CI（无需先开 PR）；main 上 push 在 merge 后跑 deploy
    branches:
      - '**'

# push 与 pull_request 共用分支名作为 group，取消进行中的重复 run
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  commit-msg:
    name: commit-msg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校验提交信息
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "首次推送或无法对比 before，跳过 commit 信息校验"
              exit 0
            fi
          fi
          bash scripts/validate-commits-range.sh "$BASE" "$HEAD"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - name: 上传构建产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist/
          retention-days: 1

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist/

      - name: Deploy via rsync
        uses: easingthemes/ssh-deploy@v6.0.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          SOURCE: docs/.vitepress/dist/
          TARGET: /var/www/linux-kernel-notes/
          ARGS: -avz --delete

  notify-failure:
    name: notify-failure
    needs: [build, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 创建或更新失败通知 Issue
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[CI] main 构建/部署失败 (${shortSha})`
            const body = [
              '## 失败摘要',
              '',
              '| Job | 结果 |',
              '|-----|------|',
              `| build | ${process.env.BUILD_RESULT} |`,
              `| deploy | ${process.env.DEPLOY_RESULT} |`,
              '',
              `- **Commit**: \`${context.sha}\``,
              `- **Workflow run**: ${runUrl}`,
              '',
              '修复后重新 push 到 `main` 或关闭本 Issue。',
            ].join('\n')

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((i) => i.title.startsWith('[CI] main 构建/部署失败'))

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再次失败（${shortSha}）\n\n${body}`,
              })
              core.info(`Updated issue #${existing.number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              core.info(`Created issue #${issue.number}`)
            }
