<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARM64 函数调用栈</title>
<style>
  :root {
    --bg: #1b1b1d;
    --fg: #e8e8ea;
    --muted: #9a9aa3;
    --card: #252528;
    --line: #3a3a40;
    --fill: #323236;
    --fill2: #3e3e44;
    --accent: #4d8dff;
    --on-accent: #f4f7ff;
    --soft: #2a3348;
    --study: #2c2c32;
    --warn: #e6c35c;
    --ok: #6dca8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font: 14px/1.45 system-ui, sans-serif;
    color: var(--fg);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 12px 28px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button {
    background: var(--fill2);
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  .pill {
    border: 1px solid var(--line);
    padding: 3px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: #3d8a60; }
  .pill.warn { color: var(--warn); border-color: #8a7020; }
  .title {
    font: 600 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 0 0 6px;
  }
  .explain { color: var(--muted); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 12px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .label.gap { margin-top: 12px; }
  .listing, .regs, .stack-wrap {
    background: var(--card);
    border: 1px solid var(--line);
  }
  .listing {
    max-height: 28rem;
    overflow: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .blank { height: 8px; }
  .ln, .meta {
    display: grid;
    grid-template-columns: 22px 64px 1fr;
    padding: 1px 8px;
  }
  .meta { color: var(--muted); }
  .ln.on { background: var(--soft); color: var(--accent); font-weight: 600; }
  .regs { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .reg {
    display: grid;
    grid-template-columns: 56px 1fr;
    border-top: 1px solid var(--line);
  }
  .reg:first-child { border-top: 0; }
  .reg span { padding: 6px 8px; }
  .reg span:first-child { color: var(--muted); }
  .reg em { font-style: normal; margin-left: 8px; color: var(--muted); font-size: 11px; }
  .reg.hot, .reg.hot span:first-child { background: var(--soft); color: var(--accent); }
  .stack-wrap { overflow-x: auto; }
  .stack {
    min-width: 520px;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh, .sr {
    display: grid;
    grid-template-columns: 44px 60px repeat(8, 26px) 1fr;
  }
  .sh { color: var(--muted); background: var(--fill); }
  .sh span, .sr span { padding: 4px 2px; text-align: center; }
  .sr { border-top: 1px solid var(--line); }
  .sr.hello { background: var(--soft); }
  .sr.study { background: var(--study); }
  .mark { color: var(--accent); font-weight: 600; text-align: left !important; padding-left: 6px !important; }
  .meaning { text-align: left !important; padding-left: 6px !important; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>ARM64 函数调用栈</h1>
  <p class="sub">每步一条指令。栈地址是示意值，看相对位置即可。</p>
  <div class="row">
    <button id="prev" type="button">上一步</button>
    <button id="play" class="primary" type="button">播放</button>
    <button id="next" type="button">下一步</button>
    <button id="reset" type="button">复位</button>
    <span id="count" class="pill"></span>
    <span id="depth" class="pill"></span>
    <span id="split" class="pill"></span>
  </div>
  <h2 id="title" class="title"></h2>
  <p id="explain" class="explain"></p>
  <div class="grid">
    <div>
      <div class="label">汇编，每步一条</div>
      <div id="listing" class="listing"></div>
    </div>
    <div>
      <div class="label">寄存器</div>
      <div id="regs" class="regs"></div>
      <div class="label gap">栈，每格 1 字节，低字节在前</div>
      <div class="stack-wrap">
        <div id="stack" class="stack"></div>
      </div>
    </div>
  </div>
</div>

const MAIN_SP = DATA.MAIN_SP;
const STUDY_SP = DATA.STUDY_SP;
const HELLO_SP = DATA.HELLO_SP;
const UNK = ['??','??','??','??','??','??','??','??'];
const HELLO_BYTES = ['68','65','6c','6c','6f','0a','00','00'];

function le8(value) {
  const v = BigInt(value);
  const out = [];
  for (let i = 0; i < 8; i++) out.push(((v >> BigInt(8 * i)) & 0xffn).toString(16).padStart(2, '0'));
  return out;
}
function stackWords(step) {
  const words = [
    { addr: 0x7ffbf8, bytes: le8(0), label: 'main 多留的 8 字节' },
    { addr: 0x7ffbf0, bytes: le8(1), label: 'main 保存的 x19' },
    { addr: 0x7ffbe8, bytes: le8(0x400948), label: 'main 保存的 x30' },
    { addr: 0x7ffbe0, bytes: le8('0x4000007ffc00'), label: 'main 保存的 x29' },
  ];
  if (step.sp <= STUDY_SP) {
    words.push(
      { addr: 0x7ffbd8, bytes: step.local0Written ? le8('0x1111222233334444') : UNK, label: step.local0Written ? 'local0  0x1111222233334444' : 'local0 还没写' },
      { addr: 0x7ffbd0, bytes: step.local1Written ? le8('0xaaaabbbbccccdddd') : UNK, label: step.local1Written ? 'local1  0xAAAABBBBCCCCDDDD' : 'local1 还没写' },
      { addr: 0x7ffbc8, bytes: le8(0x4008b0), label: 'study 保存的 x30' },
      { addr: 0x7ffbc0, bytes: le8('0x4000007ffbe0'), label: 'study 保存的 x29' },
    );
  }
  if (step.sp <= HELLO_SP) {
    words.push(
      { addr: 0x7ffbb8, bytes: step.helloCopied ? HELLO_BYTES : UNK, label: step.helloCopied ? 'msg[]  h e l l o \\n \\0' : '还没写' },
      { addr: 0x7ffbb0, bytes: UNK, label: '空着，凑齐 16 字节' },
    );
  }
  return words.filter(w => w.addr >= step.sp).sort((a, b) => b.addr - a.addr);
}
function frameKind(addr) {
  if (addr < STUDY_SP) return 'hello';
  if (addr < MAIN_SP) return 'study';
  return 'main';
}

let index = 0;
let playing = false;
let timer = 0;
const STEPS = DATA.STEPS;

function stop() {
  playing = false;
  if (timer) { clearInterval(timer); timer = 0; }
  $('play').textContent = index > 0 && index < STEPS.length - 1 ? '继续' : index >= STEPS.length - 1 ? '重播' : '播放';
}
function play() {
  if (index >= STEPS.length - 1) index = 0;
  if (playing) return;
  playing = true;
  $('play').textContent = '暂停';
  timer = setInterval(() => {
    if (index >= STEPS.length - 1) { stop(); render(); return; }
    index += 1;
    render();
  }, 1200);
}
function $(id) { return document.getElementById(id); }
function render() {
  const step = STEPS[index];
  const depth = MAIN_SP - step.sp;
  $('count').textContent = (index + 1) + ' / ' + STEPS.length;
  $('depth').textContent = 'SP 相对 main ' + (depth === 0 ? '0' : '−0x' + depth.toString(16));
  const split = step.sp !== step.fp;
  $('split').textContent = 'SP 与 x29 ' + (split ? '分开' : '重合');
  $('split').className = 'pill ' + (split ? 'warn' : 'ok');
  $('title').textContent = step.title;
  $('explain').textContent = step.explain;
  $('prev').disabled = index === 0;
  $('next').disabled = index >= STEPS.length - 1;
  if (!playing) $('play').textContent = index > 0 && index < STEPS.length - 1 ? '继续' : index >= STEPS.length - 1 ? '重播' : '播放';

  const primary = step.pcIds[0];
  const listing = $('listing');
  listing.innerHTML = DATA.ASM.map((line, i) => {
    if (line.kind === 'blank') return '<div class="blank"></div>';
    if (line.kind === 'label' || line.kind === 'comment') {
      return '<div class="meta"><span></span><span>' + (line.kind === 'label' ? line.addr : '') + '</span><span>' + esc(line.text) + '</span></div>';
    }
    const on = line.id === primary;
    return '<div class="ln' + (on ? ' on' : '') + '" id="asm-' + line.id + '"><span>' + (on ? '→' : '') + '</span><span>' + line.addr + '</span><span>' + esc(line.text) + '</span></div>';
  }).join('');
  const el = document.getElementById('asm-' + primary);
  if (el) el.scrollIntoView({ block: 'nearest' });

  $('regs').innerHTML = DATA.REG_META.filter(r => step.regs[r.key] !== '—').map(r => {
    const hot = step.changed.includes(r.key);
    return '<div class="reg' + (hot ? ' hot' : '') + '"><span>' + r.name + '</span><span>' + esc(step.regs[r.key]) + '<em>' + r.hint + '</em></span></div>';
  }).join('');

  const words = stackWords(step);
  $('stack').innerHTML = '<div class="sh"><span></span><span>地址</span>' +
    ['+0','+1','+2','+3','+4','+5','+6','+7'].map(h => '<span>' + h + '</span>').join('') +
    '<span>含义</span></div>' + words.map(word => {
      const mark = word.addr === step.sp && word.addr === step.fp ? 'SP/FP' : word.addr === step.sp ? 'SP' : word.addr === step.fp ? 'FP' : '';
      return '<div class="sr ' + frameKind(word.addr) + '"><span class="mark">' + mark + '</span><span>' + word.addr.toString(16) + '</span>' +
        word.bytes.map(b => '<span>' + b + '</span>').join('') +
        '<span class="meaning">' + esc(word.label) + '</span></div>';
    }).join('');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
$('prev').onclick = () => { stop(); index = Math.max(0, index - 1); render(); };
$('next').onclick = () => { stop(); index = Math.min(STEPS.length - 1, index + 1); render(); };
$('reset').onclick = () => { stop(); index = 0; render(); };
$('play').onclick = () => { if (playing) { stop(); } else { play(); } };
render();
</script>
